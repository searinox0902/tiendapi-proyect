name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiendapi
          POSTGRES_PASSWORD: tiendapi
          POSTGRES_DB: tiendapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiendapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tiendapi:tiendapi@localhost:5432/tiendapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest
